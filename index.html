<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
  <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-180.png" />
  <title>Cathedral of Tristram</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; -webkit-touch-callout: none; }
    #safe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #rotate { display: none; position: fixed; inset: 0; background: #000; color: #d8c89a; font: 20px serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    /* Order 8: the name form is real HTML over the canvas (above the canvas, safe-area and fullscreen layers; under #rotate) */
    #nameForm { display: none; position: fixed; inset: 0; margin: 0; z-index: 20; pointer-events: none; }
    #nameForm.on { display: block; }
    #nameForm > * { position: fixed; pointer-events: auto; box-sizing: border-box; margin: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #name { background: transparent; border: 0; outline: none; color: #fff; caret-color: #d8b860; font-family: serif; text-align: center; padding: 0 8px; border-radius: 0; -webkit-appearance: none; appearance: none; -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    #name::placeholder { color: #6a5a3a; }
    #nameOk, #nameCancel { background: transparent; border: 0; padding: 0; color: transparent; }
    #rotate { z-index: 30; }
    @media (orientation: portrait) { #rotate { display: flex; } #view { display: none; } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="safe"></div>
  <form id="nameForm" autocomplete="off" novalidate>
    <input id="name" type="text" maxlength="15" autocapitalize="words" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Hero name" />
    <button id="nameOk" type="submit" aria-label="OK"></button>
    <button id="nameCancel" type="button" aria-label="Cancel"></button>
  </form>
  <div id="rotate">Rotate your device to landscape to play.</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
